# cargo-deny policy. Every exception includes its scope and removal condition.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# No advisory exceptions yet. Add one only with a reason and a removal condition.

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0", # webpki-root-certs, used by the HTTPS catalog client
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true
# Do not add an OpenSSL/native-TLS stack to the issuer.
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]
