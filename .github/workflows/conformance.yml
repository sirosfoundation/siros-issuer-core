name: Conformance (OIDF issuer plan)

# The OpenID Foundation suite against the issuer — the
# oid4vci-1_0-issuer-test-plan, driven by the conformance repo's Playwright
# spec (specs/conformance/oid4vci-issuer-core.spec.ts) over the suite's own
# HTTP surface: both grants (pre-authorized + authorization_code), both
# credential formats (sd_jwt_vc + mso_mdoc), the four suite variants, DPoP
# sender-constraining, encrypted and plain credential responses.
#
# The stack (the conformance repo's compose): the issuer image built from
# this PR, the Mode A dev portal + status stub + TLS terminator
# (compose/siros-issuer-core.yml), go-trust in allow mode
# (compose/go-trust.yml — local-test only, never prod), and the OIDF suite
# itself (compose/conformance-suite.yml, tag pinned in
# conformance/suite-version — never :latest, an invisible upstream bump
# changes the verdict without a change here).
#
# The release-tag publish needs NO cross-repo secret: this repo's own
# workflow uploads the certification ZIPs and the run summaries to the
# release (github.token — no expiry, nothing to rotate), and the
# conformance repo's publish-releases.yml PULLS them from the public
# release assets on its daily check (or immediately, via its
# workflow_dispatch). The earlier repository_dispatch design needed a
# fine-grained PAT whose 90-day expiry would silently break the publish
# each quarter — dropped for exactly that.
#
# No module blacklist: the issuer spec runs the plan's full module set
# (the one structural skip is the suite's own proof-module selection
# split — both proof types are implemented and probed).

on:
  # PRs: the results ride the run's artifacts (the Actions tab), NOT
  # conformance.siros.org — a PR is a conversation, not a release, and
  # publishing every draft verdict would flood the site and muddy which
  # reports speak for a release. Pushes to main skip too (the suite run
  # costs minutes the merge queue does not need twice); the
  # workflow_dispatch path covers main.
  pull_request:
    paths:
      - "src/**"
      - "service/**"
      - "conformance/suite-version"
      - "Dockerfile"
      - ".github/workflows/conformance.yml"
  # Release tags: THE reports publish — conformance.siros.org carries one
  # report set per release (named for the tag), so a release's conformance
  # verdict is addressable, linkable from the release notes, and diffable
  # against the previous release's.
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "RE-TRIGGER on a release tag (e.g. v0.1.0): check out THAT tag's source, run the suites against it, upload its verdict to that tag's release. Empty = a normal dispatch (this ref's source, nothing uploaded)."
        required: false
        default: ""
      conformance-ref:
        description: "The conformance repo ref to run (default: main)"
        required: false
        default: "main"

permissions:
  # Read everywhere. The release-tag write lives on ONE job below
  # (release-upload: `permissions: contents: write`, tags only) —
  # workflow-level permission values must be literal, so the conditional
  # grant is a job boundary, not an expression. The conformance.siros.org
  # publish is the conformance repo's own pull workflow
  # (publish-releases.yml) reading these public assets — this repo hands
  # nothing over, so it holds no cross-repo credential at all, and
  # nothing here ever expires.
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  conformance:
    name: OIDF conformance (oid4vci issuer)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The suite's TLS host — the suite validates callbacks against this
      # name (the conformance repo's documented prerequisite).
      CONFORMANCE_URL: https://localhost.emobix.co.uk:8443/
      # The OIDF suite's release, PINNED (never :latest) — read from
      # conformance/suite-version (the checked-in single source; the step
      # below exports it). Compose takes it as CONFORMANCE_SUITE_TAG for
      # both suite images (server + nginx).
    steps:
      # The issuer-core source under test: the `tag` re-trigger input's
      # tag when set, else this run's own triggering ref (the PR merge,
      # the tag push, the dispatched branch).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Checkout the conformance repo (pinned ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: sirosfoundation/siros-conformance
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.conformance-ref || 'main' }}
          path: conformance-repo

      - name: The suite version (pinned, from conformance/suite-version)
        run: |
          TAG="$(grep -oE 'release-v[0-9.]+' conformance/suite-version | head -1)"
          if [ -z "$TAG" ]; then
            echo "::error::conformance/suite-version carries no release tag"
            exit 1
          fi
          echo "CONFORMANCE_SUITE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "The OIDF conformance suite: $TAG"

      - name: Build the issuer image (this ref)
        run: docker build --network=host -t siros-issuer-core:local .

      - name: The suite's TLS host
        run: echo "127.0.0.1 localhost.emobix.co.uk" | sudo tee -a /etc/hosts

      - name: Bring up the issuer conformance stack
        working-directory: conformance-repo
        run: |
          npm ci
          npx playwright install chromium --with-deps
          CONFORMANCE_SUITE_TAG="$CONFORMANCE_SUITE_TAG" \
            docker compose \
              -f compose/siros-issuer-core.yml \
              -f compose/go-trust.yml \
              -f compose/conformance-suite.yml \
              up -d --remove-orphans
          # The suite's server takes its time on first boot (the Mongo
          # seed, the Spring context); the nginx 302 is the readiness
          # signal. The issuer has its own compose healthcheck (curl
          # /healthz) the stack waits on.
          for i in $(seq 1 60); do
            if curl -sk -o /dev/null -w '%{http_code}' "${CONFORMANCE_URL%/}/" | grep -q 302; then
              echo "The suite is up (attempt $i)"
              break
            fi
            sleep 5
          done
          curl -sk -o /dev/null "${CONFORMANCE_URL%/}/" || true
          # The runner's own prerequisite: the issuer on its
          # host-published port.
          curl -sf http://localhost:9016/healthz

      - name: Run the issuer suite (oid4vci-1_0-issuer-test-plan)
        working-directory: conformance-repo
        run: |
          NODE_TLS_REJECT_UNAUTHORIZED=0 npx playwright test specs/conformance/oid4vci-issuer-core.spec.ts

      - name: The results, as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: |
            conformance-repo/conformance-results/
            conformance-repo/test-results/
            conformance-repo/playwright-report/
          if-no-files-found: warn

      # The release's conformance verdict, on the release: the
      # certification-package ZIPs (the submission's exact form) plus the
      # per-variant run summaries — github.token carries the upload, and
      # the conformance repo's pull workflow (publish-releases.yml) reads
      # these public assets on its daily check and publishes the set to
      # conformance.siros.org under releases/issuer-core/<tag>/, named for
      # the tag. No cross-repo secret, nothing to rotate. A dedicated JOB
      # (below): workflow-level permission values must be literal, so the
      # tags-only write grant is the job's own permissions block.

  # The tags-only release publish: the certification ZIPs and run
  # summaries from THIS run, on the release. github.token carries the
  # upload (no expiry, nothing to rotate); the write grant is literal
  # and scoped to this job alone. Runs even when the suite run failed —
  # the verdict is the verdict (the graceful-absence guard handles a run
  # that exported nothing).
  release-upload:
    name: The certification ZIPs, on the release (tags only)
    # The release record: a TAG PUSH (ref_type=='tag' alone is NOT enough -
    # a manual dispatch against a tag ref would otherwise masquerade as the
    # release record, with an overridden harness pin), OR the explicit
    # `tag` re-trigger (the recovery path: the named tag's verdict,
    # rebuilt by today's workflow). always(): the verdict is the verdict -
    # a failed run's exports ride too.
    if: always() && ((github.event_name == 'push' && github.ref_type == 'tag') || inputs.tag != '')
    needs: conformance
    runs-on: ubuntu-24.04
    env:
      # The release this verdict belongs to: the re-trigger's named tag,
      # else this run's own ref name (the pushed tag).
      TARGET_REF: ${{ inputs.tag || github.ref_name }}
      # gh without a checkout: the job carries no source, but gh resolves
      # its repo from a .git directory it does not have - GH_REPO pins it.
      GH_REPO: ${{ github.repository }}
    permissions:
      # Write ONLY here, ONLY on tags: the certification ZIPs and run
      # summaries upload to the release.
      contents: write
    steps:
      - name: Download this run's conformance results
        uses: actions/download-artifact@v4
        with:
          name: conformance-results
          path: .

      - name: The certification ZIPs and run summaries, on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The artifact's nesting is the upload's common-ancestor root;
          # find the plan ZIPs and summary JSONs wherever they landed.
          mapfile -t files < <(find . -type f \( -name 'conformance-report-*.zip' -o -name 'issuer-core-summary-*.json' \) || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No exported plan ZIPs or summaries"
            exit 0
          fi
          gh release upload "${TARGET_REF}" "${files[@]}" --clobber