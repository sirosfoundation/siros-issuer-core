name: Publish issuance flow

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm test
        working-directory: issuance-flow
      # npm exchanges this workflow's OIDC identity; no long-lived token.
      - run: npm publish --access public
        working-directory: issuance-flow
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}