name: Publish issuance flow

# The package's publish is automatic (issue #12 follow-up): every push to
# main that touches issuance-flow/** runs the module's tests and, when
# the version in package.json is NOT already on the registry, publishes
# it. The idempotence guard makes the flow re-run-safe — a doc-only or
# test-only change to an already-published version skips the publish (a
# green skip, never a red "already exists" failure), and a merge that
# lands several module changes publishes once. The manual dispatch stays
# (the recovery path: re-publish after a token rotation, or a deliberate
# re-run).
#
# npm Trusted Publishing (OIDC): no npm token secret anywhere — npm
# exchanges this workflow's GitHub OIDC identity for the publish. The
# npmjs-side trust config (org settings → Trusted Publisher) must match
# THIS file: repository sirosfoundation/siros-issuer-core, workflow
# publish-issuance-flow.yml, environment npm. The registry check needs
# no auth either — the registry's tarball metadata is public.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "issuance-flow/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-issuance-flow
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm test
        working-directory: issuance-flow
      - name: Skip when this version is already published (idempotent)
        id: published
        run: |
          version=$(node -p "require('./issuance-flow/package.json').version")
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://registry.npmjs.org/@sirosfoundation/issuance-flow/${version}")
          if [ "$code" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@sirosfoundation/issuance-flow@${version} is already on the registry — skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "@sirosfoundation/issuance-flow@${version} is not on the registry — publishing"
          fi
      # npm Trusted Publishing (OIDC): no token, no secret — npm exchanges
      # this workflow's GitHub OIDC identity for the publish. The npmjs-side
      # trust config must match THIS file exactly: repository
      # sirosfoundation/siros-issuer-core, workflow publish-issuance-flow.yml,
      # environment npm. NODE_AUTH_TOKEN deliberately unset (an empty token
      # shadows the OIDC path with a 401).
      - run: npm publish --access public
        if: steps.published.outputs.published == 'false'
        working-directory: issuance-flow